[package]
name = "aibaton"
version = "1.0.0"
description = "Aibaton desktop shell (Tauri 2 + AionCore v0.2.2 backend)"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
name = "aibaton_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
tauri = { version = "=2.12.4", features = ["tray-icon"] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
dirs = "6"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"

[target.'cfg(windows)'.dependencies]
tauri-plugin-single-instance = "=2.5.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
